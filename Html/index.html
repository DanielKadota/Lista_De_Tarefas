<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas</title>

  <link rel="stylesheet" href="../Css/style.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="app">

    <header class="cabecalho">
      <h1>Minhas Tarefas ✅</h1>
      <p>Você tem <span id="contadorTexto">0</span> tarefas pendentes</p>
    </header>


    <div class="formulario">

      <div class="campo-input">

        <input type="text" id="inputTarefa" placeholder="Adicionar nova tarefa…" maxlength="100">

        <p id="mensagemErro" class="mensagem-erro"></p>

      </div>

      <button id="btnAdicionar">+ Adicionar</button>

    </div>

    <div class="filtros">
      <button class="filtro filtro--ativo" data-filtro="todas">Todas</button>
      <button class="filtro" data-filtro="pendentes">Pendentes</button>
      <button class="filtro" data-filtro="concluidas">Concluídas</button>
    </div>


    <div class="lista-wrap">

      <ul id="listaTarefas"></ul>

    </div>

    <div id="estadoVazio">
      <span class="estado-vazio__icone">📋</span>
      <p class="estado-vazio__titulo">Nenhuma tarefa ainda</p>
      <p class="estado-vazio__texto">
        Digite algo acima e clique em Adicionar
      </p>
    </div>

    
  </div>

  <script src="../Js/app.js"></script>

</body>

</html>
